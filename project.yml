name: FaceTimeRecorder
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    ENABLE_DEBUG_DYLIB: NO
    CLANG_ENABLE_MODULES: YES
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/Sources/CRing"
      - "$(SRCROOT)/Sources/Support"
    OTHER_LDFLAGS: "-framework CoreAudio -framework AudioToolbox -framework AVFoundation -framework ScreenCaptureKit -framework CoreMedia -framework CoreGraphics"
targets:
  AudioProbe:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CRing
      - path: Sources/Core
      - path: Sources/Probe
    settings:
      base:
        PRODUCT_NAME: AudioProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxz.facetime.audioprobe
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/BridgingHeader.h
        GENERATE_INFOPLIST_FILE: YES
  FaceTimeRecorder:
    type: application
    platform: macOS
    sources:
      - path: Sources/CRing
      - path: Sources/Core
      - path: Sources/App
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: FaceTime Recorder
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxz.facetime.recorder
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: Resources/FaceTimeRecorder.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/BridgingHeader.h
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: 1.2.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/CRing
      - path: Sources/Core
      - path: Tests/CoreTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdxz.facetime.coretests
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/BridgingHeader.h
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  AudioProbe:
    build:
      targets:
        AudioProbe: all
    run:
      config: Debug
  FaceTimeRecorder:
    build:
      targets:
        FaceTimeRecorder: all
    run:
      config: Debug
  CoreTests:
    build:
      targets:
        CoreTests: [test]
    test:
      config: Debug
      targets:
        - CoreTests
